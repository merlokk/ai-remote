[package]
name = "statusline"
version = "0.1.0"
edition = "2024"

# This crate started with none, on the theory that a binary running on every
# render should carry no supply chain. Publishing to NATS ended that (CLAUDE.md
# §9.4): `async-nats` is the official client, and reimplementing the protocol to
# avoid it would be far worse than depending on it. `serde`/`serde_json` come in
# with it anyway, which is why `src/json.rs` no longer parses the payload by hand.
# The floor stays: nothing here is added for convenience. Root CLAUDE.md §1.
[dependencies]
async-nats = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
futures = "0.3.33"
