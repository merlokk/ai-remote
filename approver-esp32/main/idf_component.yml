## Managed dependencies (CLAUDE.md §10.4). Versions are pinned here and locked
## in `dependencies.lock`, which is committed — the same rule `uv.lock` and
## `Cargo.lock` follow for the other halves of this repository.
dependencies:
  idf:
    version: ">=5.5"

  ## cJSON, for `config.json` (§10.15) and later for the wire format of §7.
  ##
  ## It is on this list for a reason worth recording: §10.4 approved cJSON as an
  ## **in-tree** component, and in ESP-IDF v6 it is not one — it was moved out of
  ## the framework and onto the component registry. So the library is unchanged
  ## and already signed off; only its delivery is new. It is also one more entry
  ## on the v5.5.3-versus-v6.0.2 ledger of §10.12: on the version §10.4 pins,
  ## this line would not exist.
  espressif/cjson: "^1.7.18"

  ## --- The display (§10.4, §10.8) -----------------------------------------
  ## Approved as "LVGL v9 + esp_lvgl_port, the CO5300 panel and CST9220 touch
  ## drivers". Two of those four names turned out not to exist; what follows is
  ## what they resolve to on the registry, and each difference is argued where
  ## it is used rather than here.

  ## LVGL itself. §10.4 approved "v9"; this is the record of which v9.
  lvgl/lvgl: "^9.3.0"

  ## The LVGL port: the task that runs `lv_timer_handler`, the flush callback
  ## wired to `esp_lcd`, and the recursive lock everything else takes.
  ##
  ## **Not the one the vendor's example uses.** Waveshare's `09_LVGL_V9_Test`
  ## is built on `espressif/esp_lvgl_adapter`, which drags in `button`, `knob`,
  ## `freetype`, `esp_lv_decoder` and `esp_lv_fs` — five transitive components
  ## for a device that has three buttons it polls itself and no fonts to load
  ## at runtime. Root §1 asks about exactly that kind of weight. `esp_lvgl_port`
  ## is what §10.4 approved, it depends on nothing but LVGL, and it covers the
  ## same ground.
  espressif/esp_lvgl_port: "^2.9.0"

  ## The panel driver. **The glass is a CO5300 and this is the SH8601 driver**,
  ## which is not a mistake: there is no CO5300 component on the registry, and
  ## the vendor's own ESP-IDF example drives this board with this driver. The
  ## two speak the same QSPI command set, and everything specific to this glass
  ## arrives as the init list in `components/display/panel.cpp`. §10.4 says
  ## "CO5300 panel driver"; this is what that turned out to mean.
  espressif/esp_lcd_sh8601: "^2.0.1"

  ## The touch driver — CST9217, in the `waveshare` namespace, and both halves
  ## of that are worth a line. §10.4 said "CST9220": the part number in the
  ## board's documentation is CST9220 and the driver Waveshare publishes and
  ## uses for it is `cst9217` — same family, same register interface. And it is
  ## a registry component rather than a vendored tree, which is the preference
  ## §10.4 states; that the namespace is the board vendor's rather than
  ## Espressif's is the closest that preference can get for this part.
  ##
  ## It brings `espressif/esp_lcd_touch` with it — the common touch interface
  ## `esp_lvgl_port` also speaks. One transitive component, and it is the one
  ## that makes the two fit together.
  waveshare/esp_lcd_touch_cst9217: "^1.0.4"

  ## --- The bus (§10.3, §10.4, §10.5) --------------------------------------
  ## The NATS client, approved by name and version in §10.4: header-only C++,
  ## MIT, and the two things that were checked before it was chosen are both
  ## still true of 1.4.0 — `subscribe` takes a queue group, so §6's `approvers`
  ## group is expressible, and the message type carries `reply`, which is the
  ## subject §7 answers into.
  ##
  ## **It brings `espressif/esp_websocket_client`, and that is a transitive
  ## component root §1 asks about.** Its own manifest requires it
  ## unconditionally, even though its CMakeLists is written to build without
  ## one; there is no way to decline it from here. Nothing in this firmware
  ## reaches the WebSocket transport — `nats_bus.h` is the whole call surface
  ## and it has no way to name one — so what it costs is a download and
  ## whatever the linker cannot garbage-collect. §10.12 asks for that number to
  ## be taken with `idf.py size-components` rather than assumed.
  debsahu/espidf-nats: "^1.4.0"

  ## --- The signature (§10.4, §10.6) ---------------------------------------
  ## Ed25519, and it is here because mbedTLS cannot do it: there is no EdDSA in
  ## mbedTLS at all, and §6's server key is Ed25519 by fixed protocol
  ## (`protocol.SERVER_KEY_TYPE`), so *verifying* the registration reply is not
  ## a choice this firmware gets to make. Signing a decision could have been
  ## moved to P-256 — §7 has that scheme already, and both the YubiKey and the
  ## browser use it — but that would remove signing from libsodium's job, not
  ## libsodium.
  ##
  ## **Not in-tree here, and that is cJSON's story a second time.** §10.4
  ## approved it as "Espressif publishes it as a managed component", which on
  ## ESP-IDF v5.5.x is *also* an in-tree `libsodium`; on the v6.0.2 installed
  ## here the in-tree copy is gone and the registry one is the only one. Same
  ## library, same sign-off, new delivery — and one more entry on the version
  ## ledger of §10.12.
  ##
  ## It brings **nothing transitive**: its manifest depends on `idf >=4.2` and
  ## on no component at all, which is the opposite of what the NATS client did
  ## above and is worth recording next to it.
  espressif/libsodium: "^1.0.22"
