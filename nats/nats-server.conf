# The one server setting that cannot be a command-line flag.
#
# `nats-server` takes `-js`, `--store_dir`, `-m` and `--name` on the command line
# (see `docker-compose.yml`, which still passes them there) but has **no
# `--max_payload`** — it is a configuration-file key only, which is the whole
# reason this file exists. `-c` and flags combine, and flags win, so nothing else
# moves in here.
#
# 64 KB is a **fail-safe for the ESP32 responder**, not tidiness, and it is
# argued in `approver-esp32/CLAUDE.md` §10.5 and summarised in `CLAUDE.md` §3.
# Measured on that device: a 64 KB message is delivered, and anything from 128 KB
# up fails its client library's receive allocation and drops the socket — one
# reconnect per message. On the 1 MB default, anyone on this LAN could publish
# 1 MB to `approvals.*` in a loop and keep the responder permanently
# reconnecting, so a real permission request would never reach it. Refusing the
# publisher is the right end to fail at.
#
# The cost: `hook.py` puts the whole `tool_input` on the wire, so a `Write` of
# more than this cannot be approved through this bus — the publish is refused, the
# hook times out, and Claude Code asks in its own terminal (§7's fail-safe).
max_payload: 64KB

# When §10.3's "trusted network" stops being a household, this is also where the
# `tls { }` block and the user/nkey authorisation go — the reason the bound above
# arrives as a config file rather than as one more flag.
